<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Acknowledge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6f8;
        }

        .container {
            max-width: 480px;
            margin: auto;
            padding: 16px;
        }

        h2 {
            text-align: center;
            margin-bottom: 12px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .viewer {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: 14px;
            background: #fafafa;
            overflow: hidden;
            position: relative;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-top: 4px;
            font-size: 14px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            margin-top: 14px;
            font-size: 13px;
        }

        .checkbox input {
            width: auto;
            margin-right: 8px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            background: #28a745;
            color: white;
            margin-top: 16px;
            cursor: pointer;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        .success {
            color: #198754;
        }

        .error {
            color: #dc3545;
        }

        .small-note {
            font-size: 12px;
            color: #777;
            margin-top: 8px;
            text-align: center;
        }

        .view-btn {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            background: #007bff;
            color: white;
            margin-top: 10px;
            cursor: pointer;
        }

        .view-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-content {
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 2;
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 999px;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
        }

        .modal-body {
            width: 100%;
            height: 80vh;
            background: #f5f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .modal-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>📄 Safety Acknowledge</h2>

        <!-- Document -->
        <div class="card">
            <div class="card-title">📖 เอกสารสำหรับสื่อสาร</div>

            <div class="viewer">กำลังโหลดเอกสาร...</div>
            <button id="btnView" class="view-btn" disabled>🔍 View</button>
            <div class="small-note" id="docStatus">กำลังค้นหาเอกสารจากระบบ...</div>
        </div>

        <!-- Employee Info -->
        <div class="card">
            <div class="card-title">👤 ข้อมูลผู้ใช้งาน</div>

            <label>รหัสพนักงาน *</label>
            <input 
                type="text" 
                id="txtEmpCode"
                placeholder="Enter your code"
                inputmode="numeric"
                maxlength="10"
                pattern="[0-9]*"
                autocomplete="off"
            >

            <label>ชื่อ นามสกุล *</label>
            <input type="text" id="txtName" placeholder="Enter your name">

        </div>

        <!-- Confirm -->
        <div class="card">
            <div class="card-title">✅ การรับทราบ</div>

            <div class="checkbox">
                <input type="checkbox" id="chkRead">
                <span>ข้าพเจ้าได้อ่านและเข้าใจเอกสารนี้แล้ว</span>
            </div>

            <button class="btn" id="btnAck">✅ รับทราบ</button>

            <div id="status" class="status"></div>
        </div>

    </div>

    <!-- Modal -->
    <div id="docModal" class="modal">
        <div class="modal-content">
            <button id="btnCloseModal" class="modal-close">×</button>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <script>

        // ✅ CONFIG
        const FLOW_URL = "https://defaultd9cd485e39bd4cc995398c97631fbb.71.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/8200a6f10f8146e1980c92b678a0ca3c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xAGfMQgr9boz-o6GilhFNfg4LJa6ccESXYNzExOpLyM";

        // ✅ PARAM
        const urlParams = new URLSearchParams(window.location.search);
        const doc = urlParams.get("doc");
        const key = urlParams.get("key");

        // ✅ ELEMENT
        const viewer = document.querySelector(".viewer");

        const txtEmpCode = document.getElementById("txtEmpCode");
        const txtName = document.getElementById("txtName");
        const chk = document.getElementById("chkRead");

        const btnAck = document.getElementById("btnAck");
        const statusBox = document.getElementById("status");
        const btnView = document.getElementById("btnView");
        const docStatus = document.getElementById("docStatus");

        const docModal = document.getElementById("docModal");
        const modalBody = document.getElementById("modalBody");
        const btnCloseModal = document.getElementById("btnCloseModal");

        // ✅ DOCUMENT STATE
        let docDataUrl = "";
        let docMimeType = "";
        let isSubmitted = false;

        // ==============================
        // ✅ LOAD DOCUMENT FROM FLOW
        // ส่ง StatusDocument = Search + DocKey ไปให้ Flow
        // ==============================
        async function loadDocument() {
            try {
                viewer.innerHTML = "กำลังโหลดเอกสาร...";
                docStatus.innerText = "กำลังค้นหาเอกสารจากระบบ...";
                btnView.disabled = true;

                const payload = {
                    StatusDocument: "Search",
                    DocKey: key
                };

                const response = await fetch(FLOW_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error("Search document failed");
                }

                const result = await response.json();

                const rawBase64 =
                    result.FileBase64 ||
                    result.fileBase64 ||
                    result.base64 ||
                    result.FileLink ||
                    result.fileLink ||
                    "";

                docMimeType =
                    result.MimeType ||
                    result.mimeType ||
                    result.FileType ||
                    result.fileType ||
                    "image/jpeg";

                if (rawBase64.startsWith("data:")) {
                    docDataUrl = rawBase64;
                } else if (rawBase64) {
                    docDataUrl = `data:${docMimeType};base64,${rawBase64}`;
                } else {
                    throw new Error("No file returned from flow");
                }

                showDocument(docDataUrl, docMimeType);

                btnView.disabled = false;
                docStatus.innerText = "โหลดเอกสารเรียบร้อยแล้ว";

            } catch (e) {
                console.error(e);
                viewer.innerHTML = "ไม่สามารถโหลดเอกสารได้";
                docStatus.innerText = "❌ ไม่พบเอกสารหรือโหลดเอกสารไม่สำเร็จ";
                docStatus.className = "small-note error";
            }
        }

        // ==============================
        // ✅ SHOW DOCUMENT IN VIEWER
        // ==============================
        function showDocument(dataUrl, mimeType) {
            if (mimeType.toLowerCase().includes("pdf")) {
                viewer.innerHTML = `<iframe src="${dataUrl}" style="width:100%;height:100%;border:none;"></iframe>`;
            } else {
                viewer.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:contain;">`;
            }
        }

        // ==============================
        // ✅ VIEW FULL SCREEN
        // ==============================
        btnView.addEventListener("click", () => {
            if (!docDataUrl) return;

            if (docMimeType.toLowerCase().includes("pdf")) {
                modalBody.innerHTML = `<iframe src="${docDataUrl}"></iframe>`;
            } else {
                modalBody.innerHTML = `<img src="${docDataUrl}" alt="Document Preview">`;
            }

            docModal.style.display = "flex";
        });

        btnCloseModal.addEventListener("click", () => {
            docModal.style.display = "none";
            modalBody.innerHTML = "";
        });

        docModal.addEventListener("click", (e) => {
            if (e.target === docModal) {
                docModal.style.display = "none";
                modalBody.innerHTML = "";
            }
        });

        // ==============================
        // ✅ EMPLOYEE CODE = NUMBER ONLY, MAX 10
        // ==============================
        txtEmpCode.addEventListener("input", () => {
            txtEmpCode.value = txtEmpCode.value.replace(/[^0-9]/g, "").slice(0, 10);
            checkEnable();
        });

        // ==============================
        // ✅ ENABLE ACK BUTTON
        // ==============================
        function checkEnable() {
            const validEmpCode = /^\d{1,10}$/.test(txtEmpCode.value.trim());

            btnAck.disabled = !(
                validEmpCode &&
                txtName.value.trim() &&
                chk.checked
            );
        }

        btnAck.disabled = true;

        txtName.oninput = checkEnable;
        chk.onchange = checkEnable;

        // ==============================
        // ✅ SUBMIT ACK
        // ==============================
        btnAck.onclick = async () => {

            if (isSubmitted) {
                alert("✅ บันทึกแล้ว");
                return;
            }

            try {
                btnAck.disabled = true;
                btnAck.innerText = "กำลังบันทึก...";
                statusBox.innerText = "";

                const payload = {
                    StatusDocument: "Acknowledge",
                    DocumentID: doc,
                    DocKey: key,
                    EmployeeCode: txtEmpCode.value.trim(),
                    EmployeeName: txtName.value.trim(),
                    ReadDate: new Date().toISOString().split("T")[0]
                };

                const response = await fetch(FLOW_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error();

                btnAck.innerText = "✅ รับทราบแล้ว";
                statusBox.innerText = "✅ บันทึกเรียบร้อยแล้ว";
                statusBox.className = "status success";

                isSubmitted = true;

            } catch (e) {
                console.error(e);
                btnAck.disabled = false;
                btnAck.innerText = "✅ รับทราบ";

                statusBox.innerText = "❌ เกิดข้อผิดพลาด กรุณาลองใหม่";
                statusBox.className = "status error";
            }
        };

        // ==============================
        // ✅ INIT
        // ==============================
        loadDocument();

    </script>

</body>

</html>
